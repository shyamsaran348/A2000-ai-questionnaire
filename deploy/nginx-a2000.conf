# Nginx receives public traffic on ports 80/443 and passes it to the app on 127.0.0.1:3000.
# setup-server.sh replaces __DOMAIN__; certbot later adds the HTTPS (443) settings.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Submissions carry the generated PDF, so allow larger request bodies.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Build assets have unique names, so browsers can cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
